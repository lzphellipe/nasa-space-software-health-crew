services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: crew
      POSTGRES_DB: crew_health
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew -d crew_health"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://crew:crew@db:5432/crew_health
      INGEST_SOURCE: auto
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
